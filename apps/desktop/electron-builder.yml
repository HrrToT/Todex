appId: com.todex.desktop
productName: Todex
directories:
  output: release
  buildResources: build
files:
  - dist/**
  - package.json
asar: true
publish:
  provider: generic
  url: https://github.com/HrrToT/Todex/releases/download/v${version}
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Todex-${version}-win-x64.${ext}
  signAndEditExecutable: false
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
